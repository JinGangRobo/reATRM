rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::DualInfantry -> dual_infantry_hardware

      - rmcs_core::referee::Status -> referee_status
      - rmcs_core::referee::Command -> referee_command

      - rmcs_core::referee::command::Interaction -> referee_interaction
      - rmcs_core::referee::command::interaction::Ui -> referee_ui
      - rmcs_core::referee::app::ui::DualInfantry -> dual_infantry_ui

      - rmcs_core::controller::gimbal::SimpleGimbalController -> gimbal_controller
      - rmcs_core::controller::gimbal::DualYawSolver -> dual_yaw_slover
      - rmcs_core::controller::gimbal::DualYawController -> dual_yaw_controller
      - rmcs_core::controller::pid::ErrorPidController -> pitch_angle_err_pid_controller
      - rmcs_core::controller::pid::PidController -> pitch_velocity_pid_controller

      - rmcs_core::controller::chassis::OperateLogic -> operate_logic
      - rmcs_core::controller::shooting::FrictionWheelController -> friction_wheel_controller
      - rmcs_core::controller::shooting::HeatController -> heat_controller
      - rmcs_core::controller::shooting::BulletFeederController17mm -> bullet_feeder_controller
      - rmcs_core::controller::pid::PidController -> left_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> right_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> bullet_feeder_velocity_pid_controller

      - rmcs::AutoAimComponent -> auto_aim_component

      - rmcs_core::controller::chassis::ChassisController -> chassis_controller
      - rmcs_core::controller::chassis::ChassisPowerController -> chassis_power_controller
      - rmcs_core::controller::chassis::OmniWheelController -> omni_wheel_controller

      - rmcs_core::controller::diagnosis::Diagnosis -> diagnosis
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

value_broadcaster:
  ros__parameters:
    forward_list:
      - /gimbal/pitch/control_velocity
      - /gimbal/pitch/velocity_filtered
      - /gimbal/pitch/raw_angle
      - /gimbal/bottom_yaw/raw_angle
      - /gimbal/pitch/control_torque
      - /gimbal/pitch/control_angle_error
      - /debug/solver/pitch
      - /gimbal/pitch/velocity_imu
      - /debug/pitch/filtered_velocity_imu
      - /debug/solver/set_dir_angle
      - /chassis/power
      - /chassis/supercap/voltage
      - /chassis/angular_vmax
      - /chassis/translational_vmax
      - /debug/sliding_value

dual_infantry_hardware:
  ros__parameters:
    usb_pid_top_board: 0x9d15
    usb_pid_bottom_board: 0x34a4
    bottom_yaw_motor_zero_point: 6705
    top_yaw_motor_zero_point: 7850
    pitch_motor_zero_point: 35030

    imu_bias_x: 3
    imu_bias_y: 8
    imu_bias_z: 2

gimbal_controller:
  ros__parameters:
    shift_control_clamp: 0.0045

    upper_limit: -0.28
    lower_limit: 0.35

    joystick_left_bias_y: 0.0
    joystick_left_bias_x: 0.0

    depond_motors:
      - /gimbal/pitch
      - /gimbal/top_yaw
      - /gimbal/bottom_yaw

dual_yaw_controller:
  ros__parameters:
    top_yaw_angle_kp: 15.0
    top_yaw_angle_ki: 0.0
    top_yaw_angle_kd: 0.0
    top_yaw_velocity_kp: 2.0
    top_yaw_velocity_ki: 0.01
    top_yaw_velocity_kd: 0.0

    bottom_yaw_smc_c: 10.0
    bottom_yaw_smc_k: 1.5
    bottom_yaw_smc_epsilon: 1.0
    bottom_yaw_smc_phi: 2.0
    bottom_yaw_inertia: 2.0

    bottom_yaw_max_torque: 16384.0

chassis_controller:
  ros__parameters:
    translational_velocity_limit: 99.0
    angular_velocity_limit: 25.0
    autopilot_spin_velocity_default: 2.0

operate_logic:
  ros__parameters:
    comfort_translational_velocity: 10.0
    comfort_angular_velocity: 15.0

    shoot_translational_velocity: 0.5
    shoot_angular_velocity: 2.5
    shoot_boost_mode: true
    shoot_spin_mode : true

    hurt_translational_velocity: 2.5
    hurt_angular_velocity: 1.2
    hurt_boost_mode: true
    hurt_spin_mode: true

    home_translational_velocity: 1.0
    home_angular_velocity: 1.0
    home_boost_mode: false
    home_spin_mode: false

    normal_translational_velocity: 1.5
    normal_angular_velocity: 1.0
    normal_boost_mode: false
    normal_spin_mode: true


omni_wheel_controller:
  ros__parameters:
    chassis_radius_x: 0.165
    chassis_radius_y: 0.165
    wheel_radius_: 0.07
    friction_coefficient: 0.6

    spinning_bais_coefficient: -0.08

pitch_angle_err_pid_controller:
  ros__parameters:
    measurement: /gimbal/pitch/control_angle_error
    control: /gimbal/pitch/control_velocity
    enable: /gimbal/pitch/alive
    kp: 8.0
    ki: 0.001
    kd: 1.0
    integral_min: -5.0
    integral_max: 5.0

pitch_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/pitch/velocity_imu
    setpoint: /gimbal/pitch/control_velocity
    control: /gimbal/pitch/control_torque
    enable: /gimbal/pitch/alive
    kp: 2.5
    ki: 0.05
    kd: 45.0
    integral_min: -25.0
    integral_max: 25.0

friction_wheel_controller:
  ros__parameters:
    friction_wheels:
      - /gimbal/left_friction
      - /gimbal/right_friction
    friction_velocities:
      - 600.0
      - 600.0
    friction_soft_start_stop_time: 1.0

heat_controller:
  ros__parameters:
    heat_per_shot: 10000
    reserved_heat: 20000

bullet_feeder_controller:
  ros__parameters:
    bullets_per_feeder_turn: 8.0
    shot_frequency: 12.0
    safe_shot_frequency: 10.0
    eject_frequency: 10.0
    eject_time: 0.15
    deep_eject_frequency: 15.0
    deep_eject_time: 0.20
    single_shot_max_stop_delay: 2.0

left_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/left_friction/velocity
    setpoint: /gimbal/left_friction/control_velocity
    control: /gimbal/left_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.0

right_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/right_friction/velocity
    setpoint: /gimbal/right_friction/control_velocity
    control: /gimbal/right_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.0

bullet_feeder_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/bullet_feeder/velocity_filtered
    setpoint: /gimbal/bullet_feeder/control_velocity
    control: /gimbal/bullet_feeder/control_torque
    kp: 5.0
    ki: 0.0
    kd: 50.0

diagnosis:
  ros__parameters:
    motors:
      - /gimbal/pitch
      - /gimbal/top_yaw
      - /gimbal/bottom_yaw
      - /gimbal/left_friction
      - /gimbal/right_friction
      - /gimbal/bullet_feeder
      - /chassis/left_front_wheel
      - /chassis/right_front_wheel
      - /chassis/left_back_wheel
      - /chassis/right_back_wheel

    enable_motor_check: true
    enable_supercap_check: true
    enable_aim_check: true
    enable_nav_check: false
