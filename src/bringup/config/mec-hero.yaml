rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::Hero -> hero_hardware

      - rmcs_core::referee::Status -> referee_status
      - rmcs_core::referee::Command -> referee_command

      - rmcs_core::referee::command::Interaction -> referee_interaction
      - rmcs_core::referee::command::interaction::Ui -> referee_ui
      # - rmcs_core::referee::app::ui::TestHeroUI -> referee_ui_hero

      - rmcs_core::controller::gimbal::SimpleGimbalController -> gimbal_controller
      - rmcs_core::controller::pid::ErrorPidController -> yaw_angle_pid_controller
      - rmcs_core::controller::pid::PidController -> yaw_velocity_pid_controller
      - rmcs_core::controller::pid::ErrorPidController -> pitch_angle_pid_controller
      - rmcs_core::controller::pid::PidController -> pitch_velocity_pid_controller

      - rmcs_core::controller::shooting::FrictionWheelController -> friction_wheel_controller
      - rmcs_core::controller::shooting::HeatController -> heat_controller
      - rmcs_core::controller::shooting::BulletFeederController42mm -> bullet_feeder_controller
      - rmcs_core::controller::pid::PidController -> first_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> second_friction_velocity_pid_controller
      - rmcs_core::controller::pid::PidController -> third_friction_velocity_pid_controller

      - rmcs_core::controller::chassis::ChassisController -> chassis_controller
      - rmcs_core::controller::chassis::ChassisPowerController -> chassis_power_controller
      - rmcs_core::controller::chassis::OmniWheelController -> omni_wheel_controller

      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

value_broadcaster:
  ros__parameters:
    forward_list:
      - /debug/pitch/raw_angle
      - /gimbal/pitch/angle
      - /gimbal/yaw/angle
      - /gimbal/pitch/control_torque
      - /gimbal/yaw/control_angle_error
      - /gimbal/pitch/control_angle_error
      - /gimbal/pitch/velocity_imu
      - /gimbal/yaw/velocity_imu
      - /debug/feeder/temp
      - /debug/feeder/mos_temp
      - /gimbal/bullet_feeder/control_torque

hero_hardware:
  ros__parameters:
    usb_pid_top_board: 0xaaa3
    usb_pid_bottom_board: 0x9f00
    yaw_motor_zero_point: 5500
    pitch_motor_zero_point: 33685

    imu_bias_x: 1
    imu_bias_y: 3
    imu_bias_z: 3

gimbal_controller:
  ros__parameters:
    upper_limit: -0.6
    lower_limit: 0.15

    joystick_left_bias_y: 0.0
    joystick_left_bias_x: 0.0

yaw_angle_pid_controller:
  ros__parameters:
    measurement: /gimbal/yaw/control_angle_error
    # feedforward: -/chassis/yaw/velocity_imu
    control: /gimbal/yaw/control_velocity
    kp: 12.0
    ki: 0.01
    kd: 0.0
    integral_min: -10.0
    integral_max: 10.0

yaw_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/yaw/velocity_imu
    setpoint: /gimbal/yaw/control_velocity
    control: /gimbal/yaw/control_torque
    kp: 10.0
    ki: 0.011
    kd: 110.0

pitch_angle_pid_controller:
  ros__parameters:
    measurement: /gimbal/pitch/control_angle_error
    control: /gimbal/pitch/control_velocity
    kp: 10.0
    ki: 0.01
    kd: 0.0
    integral_min: -1.0
    integral_max: 1.0

pitch_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/pitch/velocity_imu
    setpoint: /gimbal/pitch/control_velocity
    control: /gimbal/pitch/control_torque
    kp: 5.0
    ki: 0.02
    kd: 100.0
    integral_min: -3.0
    integral_max: 3.0

friction_wheel_controller:
  ros__parameters:
    friction_wheels:
      - /gimbal/first_friction
      - /gimbal/second_friction
      - /gimbal/third_friction
    friction_velocities:
      - 450.00
      - 450.00
      - 450.00
    friction_soft_start_stop_time: 1.0

heat_controller:
  ros__parameters:
    heat_per_shot: 10000
    reserved_heat: -100

first_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/first_friction/velocity
    setpoint: /gimbal/first_friction/control_velocity
    control: /gimbal/first_friction/control_torque
    kp: 0.003436926
    ki: 0.00
    kd: 0.009373434

second_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/second_friction/velocity
    setpoint: /gimbal/second_friction/control_velocity
    control: /gimbal/second_friction/control_torque
    kp: 0.003436926
    ki: 0.00
    kd: 0.009373434

third_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/third_friction/velocity
    setpoint: /gimbal/third_friction/control_velocity
    control: /gimbal/third_friction/control_torque
    kp: 0.003436926
    ki: 0.00
    kd: 0.009373434
