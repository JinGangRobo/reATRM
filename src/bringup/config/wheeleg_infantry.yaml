wheeleg_infantry_hardware:
  ros__parameters:
    usb_pid_bottom_board: 0x117e
    bottom_yaw_motor_zero_point: 0
    top_yaw_motor_zero_point: -350
    pitch_motor_zero_point: 6500

    left_front_hip_motors_zero_point: 28225
    left_back_hip_motors_zero_point: 29176
    right_front_hip_motors_zero_point: 34163
    right_back_hip_motors_zero_point: 30358
  
    

    
    

    imu_bias_x: 0
    imu_bias_y: 0
    imu_bias_z: 0


gimbal_controller:
  ros__parameters:
    upper_limit: -0.189
    lower_limit: 0.4

    joystick_left_bias_y: 0.0
    joystick_left_bias_x: 0.0



