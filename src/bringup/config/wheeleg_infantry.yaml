left_wheel_velocity_pid_controller:
  ros__parameters:
    measurement: /chassis/left_wheel/velocity
    setpoint: /chassis/left_wheel/control_velocity
    control: /chassis/left_wheel/control_torque_unrestricted
    kp: 0.185
    ki: 0.00
    kd: 0.00

right_wheel_velocity_pid_controller:
  ros__parameters:
    measurement: /chassis/right_wheel/velocity
    setpoint: /chassis/right_wheel/control_velocity
    control: /chassis/right_wheel/control_torque_unrestricted
    kp: 0.185
    ki: 0.00
    kd: 0.00

heat_controller:
  ros__parameters:
    heat_per_shot: 10000
    reserved_heat: -100

bullet_feeder_controller:
  ros__parameters:
    bullets_per_feeder_turn: 9.0
    shot_frequency: 24.0
    safe_shot_frequency: 10.0
    eject_frequency: 15.0
    eject_time: 0.15
    deep_eject_frequency: 15.0
    deep_eject_time: 0.20
    single_shot_max_stop_delay: 2.0

left_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/left_friction/velocity
    setpoint: /gimbal/left_friction/control_velocity
    control: /gimbal/left_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.0

right_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/right_friction/velocity
    setpoint: /gimbal/right_friction/control_velocity
    control: /gimbal/right_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.0

bullet_feeder_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/bullet_feeder/velocity
    setpoint: /gimbal/bullet_feeder/control_velocity
    control: /gimbal/bullet_feeder/control_torque
    kp: 1.0
    ki: 0.0
    kd: 0.0

diagnosis:
  ros__parameters:
    motors:
      - /chassis/left_front_hip


    enable_motor_check: true
    enable_supercap_check: false
    enable_aim_check: true
    enable_nav_check: false
    