wheeleg_infantry_hardware:
  ros__parameters:
    usb_pid_top_board: 0x34a4
    usb_pid_bottom_board: 0x13b4

    yaw_motor_zero_point: 43327
    pitch_motor_zero_point: 30938

    left_front_hip_motors_zero_point: 28225
    left_back_hip_motors_zero_point: 29176
    # left_front_hip_motors_zero_point: 7685
    # left_back_hip_motors_zero_point: 8566
    right_front_hip_motors_zero_point: 34163
    right_back_hip_motors_zero_point: 30358
  
    

    
    

    imu_bias_x: 0
    imu_bias_y: 0
    imu_bias_z: 0

chassis_controller:
  ros__parameters:
    translational_velocity_limit: 20.0
    angular_velocity_limit: 7.0


gimbal_controller:
  ros__parameters:
    upper_limit: -0.4
    lower_limit: 0.4

    joystick_left_bias_y: 0.0
    joystick_left_bias_x: 0.0



yaw_angle_pid_controller:
  ros__parameters:
    measurement: /gimbal/yaw/control_angle_error
    control: /gimbal/yaw/control_velocity
    enable: /gimbal/yaw/alive
    kp: 16.0
    ki: 0.01
    kd: 0.0
    integral_min: -10.0
    integral_max: 10.0

yaw_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/yaw/velocity_imu
    setpoint: /gimbal/yaw/control_velocity
    control: /gimbal/yaw/control_torque
    enable: /gimbal/yaw/alive
    kp: 1.0
    ki: 0.0
    kd: 0.0
    integral_min: -60.0
    integral_max: 60.0

pitch_angle_pid_controller:
  ros__parameters:
    measurement: /gimbal/pitch/control_angle_error
    control: /gimbal/pitch/control_velocity
    enable: /gimbal/pitch/alive
    kp: 10.0
    ki: 0.01
    kd: 0.0
    integral_min: -1.0
    integral_max: 1.0

pitch_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/pitch/velocity_imu
    setpoint: /gimbal/pitch/control_velocity
    control: /gimbal/pitch/control_torque
    enable: /gimbal/pitch/alive
    kp: 1.0
    ki: 0.0
    kd: 0.0

friction_wheel_controller:
  ros__parameters:
    friction_wheels:
      - /gimbal/left_friction
      - /gimbal/right_friction
    friction_velocities:
      - 600.0
      - 600.0
    friction_soft_start_stop_time: 1.0


heat_controller:
  ros__parameters:
    heat_per_shot: 10000
    reserved_heat: -100

bullet_feeder_controller:
  ros__parameters:
    bullets_per_feeder_turn: 10.0
    shot_frequency: 15.0
    safe_shot_frequency: 10.0
    eject_frequency: 15.0
    eject_time: 0.15
    deep_eject_frequency: 15.0
    deep_eject_time: 0.20
    single_shot_max_stop_delay: 1.0

left_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/left_friction/velocity
    setpoint: /gimbal/left_friction/control_velocity
    control: /gimbal/left_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.0

right_friction_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/right_friction/velocity
    setpoint: /gimbal/right_friction/control_velocity
    control: /gimbal/right_friction/control_torque
    kp: 0.003436926
    ki: 0.0
    kd: 0.0

bullet_feeder_velocity_pid_controller:
  ros__parameters:
    measurement: /gimbal/bullet_feeder/velocity
    setpoint: /gimbal/bullet_feeder/control_velocity
    control: /gimbal/bullet_feeder/control_torque
    kp: 1.0
    ki: 0.0
    kd: 0.0

diagnosis:
  ros__parameters:
    motors:
      - /chassis/left_front_hip


    enable_motor_check: true
    enable_supercap_check: false
    enable_aim_check: true
    enable_nav_check: false
    